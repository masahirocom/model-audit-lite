name: Publish to PyPI

# Trusted Publishing (OIDC): no API token is stored anywhere. Register this workflow once at
# https://pypi.org/manage/account/publishing/ (owner masahirocom, repo model-audit-lite, workflow publish.yml, environment pypi).
# Then publish by creating a GitHub Release (tag vX.Y.Z) or running this workflow manually.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -U pip build pytest
          python -m pip install -e .
          python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
