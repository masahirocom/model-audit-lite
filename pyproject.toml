[project]
name = "model-audit-lite"
version = "0.1.0"
description = "Lightweight, extensible safety/distribution audit for Hugging Face models: pickle/custom-code detection + checksum + a small known-pattern prompt-injection probe suite."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "masahirocom" }
]
dependencies = [
    "huggingface_hub>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mlx = ["mlx-lm"]
transformers = ["transformers", "torch"]

[project.scripts]
model-audit-lite = "model_audit_lite.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model_audit_lite*"]

[tool.setuptools.package-data]
model_audit_lite = ["probes/*.yaml"]
